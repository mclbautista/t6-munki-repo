[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "munki-fleet"
version = "0.1.0"
description = "Build, publish and verify the T6 Munki repository metadata (see docs/adr/0001)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["munki_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
